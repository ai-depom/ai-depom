<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>AI-DEPOM - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --bg-card: #0d0d0d;
            --text-primary: #00ff88;
            --text-secondary: #00cc77;
            --text-muted: #004d33;
            --border-color: #003322;
            --shadow-color: rgba(0, 255, 136, 0.08);
            --gradient-green: linear-gradient(135deg, #00ff88 0%, #00cc77 100%);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; min-height: 100vh;
            margin: 0; padding: 0;
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
        }
        body {
            display: flex; align-items: center; justify-content: center;
            padding: 20px; min-height: 100vh;
        }
        .login-container {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            width: 100%; max-width: 450px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
        }
        .login-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: var(--gradient-green);
            animation: gradientMove 3s ease infinite;
            background-size: 200% 100%;
        }
        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .logo-area { text-align: center; margin-bottom: 30px; }
        .logo-area .icon {
            font-size: 48px; color: var(--text-primary);
            background: rgba(0, 255, 136, 0.05);
            width: 90px; height: 90px; line-height: 90px;
            border-radius: 50%;
            display: inline-block;
            margin-bottom: 15px;
            border: 2px solid var(--border-color);
            box-shadow: 0 0 40px var(--shadow-color);
        }
        .logo-area h1 { font-size: 24px; color: var(--text-primary); font-weight: 700; letter-spacing: 2px; }
        .logo-area p { color: rgba(0, 255, 136, 0.4); font-size: 13px; margin-top: 8px; letter-spacing: 1px; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block; font-size: 12px; font-weight: 600;
            color: rgba(0, 255, 136, 0.5);
            margin-bottom: 8px; letter-spacing: 1px;
            text-transform: uppercase;
        }
        .form-group .input-wrapper { position: relative; }
        .form-group .input-wrapper > i {
            position: absolute; left: 16px; top: 50%;
            transform: translateY(-50%);
            color: rgba(0, 255, 136, 0.3);
            font-size: 16px;
        }
        .form-group input {
            width: 100%; padding: 14px 45px 14px 45px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 15px;
            background: rgba(0, 0, 0, 0.5);
            color: var(--text-primary);
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--text-primary);
            background: rgba(0, 0, 0, 0.7);
            box-shadow: 0 0 0 4px rgba(0, 255, 136, 0.08);
        }
        .form-group input::placeholder { color: rgba(0, 255, 136, 0.2); }
        .form-group .toggle-password {
            position: absolute; right: 16px; top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: rgba(0, 255, 136, 0.3);
            background: none; border: none;
            font-size: 16px;
        }
        .form-group .toggle-password:hover { color: var(--text-primary); }
        .btn-login {
            width: 100%; padding: 15px;
            background: var(--gradient-green);
            color: #000;
            border: none; border-radius: 10px;
            font-size: 15px; font-weight: 700;
            cursor: pointer; transition: all 0.3s;
            letter-spacing: 1px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.3);
        }
        .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-login .spinner {
            display: none; width: 18px; height: 18px;
            border: 3px solid rgba(0, 0, 0, 0.2);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .btn-login.loading .spinner { display: block; }
        .btn-login.loading .btn-text { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .esqueci-senha {
            text-align: center; margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }
        .esqueci-senha a {
            color: rgba(0, 255, 136, 0.5);
            font-size: 13px;
            text-decoration: none;
            transition: all 0.3s;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .esqueci-senha a:hover { color: var(--text-primary); }
        .error-message, .success-message {
            display: none;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            align-items: center;
            gap: 10px;
        }
        .error-message.show, .success-message.show { display: flex; }
        .error-message {
            background: rgba(220, 53, 69, 0.1);
            color: #dc3545;
            border-left: 4px solid #dc3545;
        }
        .success-message {
            background: rgba(0, 255, 136, 0.1);
            color: var(--text-primary);
            border-left: 4px solid var(--text-primary);
        }
        /* MODAL DE RECUPERAÇÃO */
        .modal-recuperar {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px);
            z-index: 9999;
            justify-content: center; align-items: center;
            padding: 20px;
        }
        .modal-recuperar.open { display: flex; }
        .modal-recuperar-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 35px;
            width: 100%; max-width: 450px;
            box-shadow: 0 20px 60px rgba(0, 255, 136, 0.1);
        }
        .modal-recuperar-content h3 {
            color: var(--text-primary);
            font-size: 20px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .modal-recuperar-content p {
            color: rgba(0, 255, 136, 0.4);
            font-size: 13px;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .modal-actions {
            display: flex; gap: 10px;
            margin-top: 20px;
        }
        .btn-cancelar {
            flex: 1; padding: 12px;
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--text-primary);
            border-radius: 10px;
            font-weight: 600; cursor: pointer;
            transition: all 0.3s;
        }
        .btn-cancelar:hover { background: rgba(0, 255, 136, 0.05); }
        .btn-enviar {
            flex: 1; padding: 12px;
            background: var(--gradient-green);
            color: #000; border: none;
            border-radius: 10px;
            font-weight: 700; cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }
        .btn-enviar:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0, 255, 136, 0.3); }
        .btn-enviar:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .footer-text {
            text-align: center; margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            font-size: 11px;
            color: rgba(0, 255, 136, 0.2);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-area">
            <div class="icon"><i class="fas fa-shield-halved"></i></div>
            <h1>AI-DEPOM</h1>
            <p>ACESSO RESTRITO</p>
        </div>

        <div id="errorMessage" class="error-message">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText">Erro ao fazer login.</span>
        </div>

        <div id="successMessage" class="success-message">
            <i class="fas fa-check-circle"></i>
            <span id="successText">Sucesso!</span>
        </div>

        <form id="formLogin">
            <div class="form-group">
                <label for="login"><i class="fas fa-id-card"></i> Matrícula ou E-mail</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="login" placeholder="ADM-MASTER-001 ou seu@email.com" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label for="senha"><i class="fas fa-lock"></i> Senha</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="senha" placeholder="Digite sua senha" required autocomplete="current-password">
                    <button type="button" class="toggle-password" id="toggleSenha"><i class="fas fa-eye"></i></button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="btnLogin">
                <span class="spinner"></span>
                <span class="btn-text"><i class="fas fa-sign-in-alt"></i> ENTRAR</span>
            </button>
        </form>

        <div class="esqueci-senha">
            <a href="#" onclick="abrirModalRecuperar(); return false;">
                <i class="fas fa-question-circle"></i> Esqueci minha senha
            </a>
        </div>

        <div class="footer-text">
            <i class="fas fa-shield-alt"></i> Sua seguranca e nossa prioridade
        </div>
    </div>

    <!-- MODAL DE RECUPERAÇÃO DE SENHA -->
    <div class="modal-recuperar" id="modalRecuperar">
        <div class="modal-recuperar-content">
            <h3><i class="fas fa-key me-2"></i>Recuperar Senha</h3>
            <p>Digite seu email cadastrado. Enviaremos um link para você criar uma nova senha.</p>

            <div class="form-group">
                <label for="emailRecuperar">Email cadastrado</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="emailRecuperar" placeholder="seu.email@pcivil.ba.gov.br">
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn-cancelar" onclick="fecharModalRecuperar()">
                    <i class="fas fa-times me-2"></i>CANCELAR
                </button>
                <button class="btn-enviar" id="btnEnviarLink" onclick="enviarLinkRecuperacao()">
                    <i class="fas fa-paper-plane me-2"></i>ENVIAR LINK
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-config.js"></script>
    <script>
        // ============================================================
        // ESTADO GLOBAL
        // ============================================================
        let usuarioLogado = null;

        // ============================================================
        // INICIALIZAÇÃO — v2.3.0
        // ============================================================
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('🔐 AI-DEPOM - Login v2.3.0');
            console.log('📍 URL:', window.location.href);
            console.log('📍 Hash:', window.location.hash);

            // ============================================================
            // [NOVO v2.3.0] PRIORIDADE MÁXIMA: veio de link de convite/recovery?
            // ============================================================
            const fullUrl = (window.location.hash || '') + (window.location.search || '');
            const isConvite = fullUrl.includes('type=invite')
                           || fullUrl.includes('type=recovery')
                           || fullUrl.includes('type=signup')
                           || fullUrl.includes('access_token=')
                           || fullUrl.includes('code=');

            if (isConvite) {
                console.log('📧 Link de convite/recovery detectado');
                console.log('🔀 Redirecionando...');

                // [CORRIGIDO v2.3.0] Decide o destino com base no tipo
                const tipo = fullUrl.includes('type=recovery') ? 'recovery'
                           : fullUrl.includes('type=invite') ? 'invite'
                           : fullUrl.includes('type=signup') ? 'signup'
                           : 'desconhecido';

                console.log('📋 Tipo do link:', tipo);

                // [CORRIGIDO v2.3.0] Recovery → 03b-redefinir-senha.html
                //                    Invite/signup → 03-primeiro-acesso.html
                const destino = (tipo === 'recovery') ? '03b-redefinir-senha.html' : '03-primeiro-acesso.html';

                // [CORRIGIDO v2.3.0] Preserva o hash/query ao redirecionar
                const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
                const urlDestino = baseUrl + '/' + destino + window.location.search + window.location.hash;

                console.log('🎯 Destino:', urlDestino);
                window.location.href = urlDestino;
                return;
            }

            // ============================================================
            // [v2.3.0] Verifica sessão ativa
            // ============================================================
            try {
                const { data: { user } } = await window.supabaseClient.auth.getUser();
                if (user) {
                    console.log('✅ Sessão ativa detectada:', user.email);

                    // Verifica se precisa trocar senha primeiro
                    const { data: usuario } = await window.supabaseClient
                        .from('usuarios')
                        .select('primeiro_acesso')
                        .eq('id', user.id)
                        .maybeSingle();

                    if (usuario?.primeiro_acesso) {
                        console.log('🔑 Primeiro acesso pendente');
                        window.location.href = '03-primeiro-acesso.html';
                    } else {
                        console.log('✅ Redirecionando pro dashboard');
                        window.location.href = '04-dashboard.html';
                    }
                    return;
                }
            } catch (err) {
                console.log('ℹ️ Sem sessão ativa');
            }
        });

        // ============================================================
        // TOGGLE SENHA
        // ============================================================
        document.getElementById('toggleSenha').addEventListener('click', function() {
            const input = document.getElementById('senha');
            input.setAttribute('type', input.getAttribute('type') === 'password' ? 'text' : 'password');
            this.querySelector('i').classList.toggle('fa-eye');
            this.querySelector('i').classList.toggle('fa-eye-slash');
        });

        // ============================================================
        // MENSAGENS
        // ============================================================
        function mostrarErro(msg) {
            document.getElementById('errorText').textContent = msg;
            document.getElementById('errorMessage').classList.add('show');
            document.getElementById('successMessage').classList.remove('show');
            setTimeout(() => document.getElementById('errorMessage').classList.remove('show'), 8000);
        }

        function mostrarSucesso(msg) {
            document.getElementById('successText').textContent = msg;
            document.getElementById('successMessage').classList.add('show');
            document.getElementById('errorMessage').classList.remove('show');
            setTimeout(() => document.getElementById('successMessage').classList.remove('show'), 8000);
        }

        // ============================================================
        // LOGIN — aceita MATRÍCULA ou E-MAIL
        // ============================================================
        document.getElementById('formLogin').addEventListener('submit', async function(e) {
            e.preventDefault();
            const inputLogin = document.getElementById('login').value.trim();
            const senha = document.getElementById('senha').value;
            const btn = document.getElementById('btnLogin');

            if (!inputLogin || !senha) {
                mostrarErro('Preencha todos os campos.');
                return;
            }

            btn.disabled = true;
            btn.classList.add('loading');

            try {
                let emailParaLogin = inputLogin;

                // Detecta se é matrícula (sem @) ou e-mail (com @)
                if (!inputLogin.includes('@')) {
                    console.log('🔍 Matrícula detectada:', inputLogin);

                    const { data: usuarioPorMatricula, error: errBusca } = await window.supabaseClient
                        .from('usuarios')
                        .select('id, email, nome_completo, ativo, deletado')
                        .eq('matricula', inputLogin)
                        .maybeSingle();

                    if (errBusca) {
                        console.error('❌ Erro ao buscar matrícula:', errBusca);
                        mostrarErro('Erro ao buscar matrícula. Tente novamente.');
                        return;
                    }

                    if (!usuarioPorMatricula) {
                        mostrarErro('Matrícula não encontrada.');
                        return;
                    }

                    if (usuarioPorMatricula.deletado) {
                        mostrarErro('Usuário desativado. Contate o administrador.');
                        return;
                    }

                    if (!usuarioPorMatricula.ativo) {
                        mostrarErro('Usuário inativo. Contate o administrador.');
                        return;
                    }

                    emailParaLogin = usuarioPorMatricula.email;
                    console.log('✅ E-mail encontrado para a matrícula:', emailParaLogin);

                } else {
                    console.log('📧 E-mail detectado:', inputLogin);
                }

                // Faz o login
                console.log('🔐 Tentando login com:', emailParaLogin);

                const { data, error } = await window.supabaseClient.auth.signInWithPassword({
                    email: emailParaLogin,
                    password: senha
                });

                if (error) {
                    console.error('❌ Erro no login:', error);
                    let msg = 'Credenciais inválidas.';
                    if (error.message.includes('Invalid login')) msg = 'Matrícula/e-mail ou senha incorretos.';
                    else if (error.message.includes('Email not confirmed')) msg = 'Email não confirmado. Verifique sua caixa de entrada.';
                    mostrarErro(msg);
                    return;
                }

                console.log('✅ Login OK:', data.user.email);

                // Busca dados completos do usuário
                const { data: usuario, error: errUsuario } = await window.supabaseClient
                    .from('usuarios')
                    .select('id, nome_completo, email, setor, matricula, id_perfil_acesso, primeiro_acesso, ativo, deletado')
                    .eq('id', data.user.id)
                    .single();

                if (errUsuario || !usuario) {
                    console.error('❌ Usuário não encontrado na tabela:', errUsuario);
                    mostrarErro('Usuário não cadastrado no sistema. Contate o administrador.');
                    await window.supabaseClient.auth.signOut();
                    return;
                }

                if (usuario.deletado) {
                    mostrarErro('Usuário desativado. Contate o administrador.');
                    await window.supabaseClient.auth.signOut();
                    return;
                }

                if (!usuario.ativo) {
                    mostrarErro('Usuário inativo. Contate o administrador.');
                    await window.supabaseClient.auth.signOut();
                    return;
                }

                // Salva no localStorage
                localStorage.setItem('usuario', JSON.stringify(usuario));
                console.log('✅ Usuário salvo:', usuario.nome_completo, '| Matrícula:', usuario.matricula);

                mostrarSucesso('Login realizado! Redirecionando...');

                // Redireciona baseado em primeiro_acesso
                setTimeout(() => {
                    if (usuario.primeiro_acesso) {
                        console.log('🔑 Primeiro acesso detectado');
                        window.location.href = '03-primeiro-acesso.html';
                    } else {
                        window.location.href = '04-dashboard.html';
                    }
                }, 1000);

            } catch (error) {
                console.error('❌ Erro inesperado:', error);
                mostrarErro('Erro inesperado: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.classList.remove('loading');
            }
        });

        // ============================================================
        // MODAL DE RECUPERAÇÃO
        // ============================================================
        function abrirModalRecuperar() {
            document.getElementById('modalRecuperar').classList.add('open');
            document.getElementById('emailRecuperar').value = '';
            setTimeout(() => document.getElementById('emailRecuperar').focus(), 100);
        }

        function fecharModalRecuperar() {
            document.getElementById('modalRecuperar').classList.remove('open');
        }

        // Fecha modal clicando fora
        document.getElementById('modalRecuperar').addEventListener('click', function(e) {
            if (e.target === this) fecharModalRecuperar();
        });

        // Fecha modal com ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') fecharModalRecuperar();
        });

        // ============================================================
        // [CORRIGIDO v2.3.0] ENVIAR LINK DE RECUPERAÇÃO
        // Agora monta a URL correta com base no path atual
        // ============================================================
        async function enviarLinkRecuperacao() {
            const email = document.getElementById('emailRecuperar').value.trim();
            const btn = document.getElementById('btnEnviarLink');

            if (!email || !email.includes('@')) {
                alert('⚠️ Digite um email válido');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>ENVIANDO...';

            try {
                console.log('📧 Enviando link de recuperação para:', email);

                // [CORRIGIDO v2.3.0] Monta URL correta com base no path atual
                // Produção: https://ai-depom.github.io/ai-depom/02-login.html → https://ai-depom.github.io/ai-depom
                // Local:    http://localhost:5500/02-login.html             → http://localhost:5500
                const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
                const redirectUrl = baseUrl + '/03b-redefinir-senha.html';

                console.log('🔗 Redirect URL montada:', redirectUrl);

                const { error } = await window.supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: redirectUrl
                });

                if (error) {
                    console.error('❌ Erro:', error);
                    alert('❌ Erro ao enviar: ' + error.message);
                    return;
                }

                console.log('✅ Email enviado!');
                fecharModalRecuperar();
                mostrarSucesso('📧 Link enviado! Verifique sua caixa de entrada (' + email + ')');

            } catch (error) {
                console.error('❌ Erro inesperado:', error);
                alert('❌ Erro inesperado: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane me-2"></i>ENVIAR LINK';
            }
        }
    </script>
</body>
</html>
