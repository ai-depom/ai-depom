 <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI-DEPOM - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --text-primary: #00ff88;
            --text-secondary: #00cc77;
            --text-muted: #004d33;
            --border-color: #003322;
            --shadow-color: rgba(0, 255, 136, 0.08);
            --gradient-green: linear-gradient(135deg, #00ff88 0%, #00cc77 100%);
            --control-size: 36px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* Controles Bar */
        .controls-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-color);
            padding: 6px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 48px;
            min-height: 48px;
        }

        .controls-left { display: flex; gap: 4px; align-items: center; }
        .controls-right { display: flex; gap: 4px; align-items: center; }
        .controls-center { display: flex; align-items: center; gap: 8px; }
        .controls-center .system-title { color: var(--text-primary); font-weight: 600; font-size: 14px; letter-spacing: 1px; }

        .control-btn {
            width: var(--control-size);
            height: var(--control-size);
            border-radius: 8px;
            border: none;
            background: transparent;
            color: rgba(0, 255, 136, 0.3);
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover { background: rgba(0, 255, 136, 0.08); color: var(--text-primary); }
        .control-btn:active { transform: scale(0.92); }
        .control-btn.close-btn:hover { background: rgba(220, 53, 69, 0.15); color: #dc3545; }
        .control-btn.minimize-btn:hover { background: rgba(255, 193, 7, 0.15); color: #ffc107; }
        .controls-divider { width: 1px; height: 24px; background: rgba(0, 255, 136, 0.05); margin: 0 6px; }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(0, 255, 136, 0.3);
            font-size: 12px;
        }

        .user-info .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--gradient-green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
            color: #000;
        }

        /* Login Container */
        .login-container {
            max-width: 480px;
            width: 100%;
            margin: 70px auto 40px;
            background: var(--bg-secondary);
            border-radius: 24px;
            padding: 45px 40px;
            border: 1px solid var(--border-color);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
        }

        .logo { text-align: center; margin-bottom: 35px; }
        .logo i { font-size: 64px; color: var(--text-primary); background: rgba(0, 255, 136, 0.05); padding: 20px; border-radius: 50%; }
        .logo h1 { color: var(--text-primary); font-weight: 700; letter-spacing: 3px; margin-top: 15px; text-shadow: 0 0 40px rgba(0, 255, 136, 0.1); }
        .logo span { color: rgba(0, 255, 136, 0.3); font-size: 14px; letter-spacing: 2px; }

        .form-control {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 14px 18px;
            border-radius: 14px;
            transition: all 0.3s;
        }

        .form-control:focus {
            background: rgba(0, 0, 0, 0.6);
            border-color: var(--text-primary);
            box-shadow: 0 0 0 4px rgba(0, 255, 136, 0.08);
            color: var(--text-primary);
        }

        .form-control::placeholder { color: rgba(0, 255, 136, 0.2); }
        .form-label { font-size: 13px; font-weight: 600; color: rgba(0, 255, 136, 0.3); letter-spacing: 0.5px; }

        .btn-login {
            background: var(--gradient-green);
            color: #000;
            font-weight: 700;
            padding: 14px;
            border-radius: 14px;
            transition: all 0.3s;
            letter-spacing: 1px;
            font-size: 16px;
            border: none;
            width: 100%;
        }

        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0, 255, 136, 0.3); }

        .otp-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            text-align: center;
            font-size: 28px;
            letter-spacing: 12px;
            border-radius: 14px;
            padding: 12px;
            font-weight: 300;
        }

        .otp-input:focus {
            border-color: var(--text-primary);
            box-shadow: 0 0 0 4px rgba(0, 255, 136, 0.08);
        }

        .biometric-area {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            border: 1px dashed var(--border-color);
        }

        .biometric-area video {
            width: 100%;
            max-width: 200px;
            border-radius: 12px;
            border: 2px solid var(--text-primary);
            background: #000;
            display: none;
        }

        .security-badge {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            font-size: 11px;
            color: rgba(0, 255, 136, 0.2);
        }

        .security-badge i { margin-right: 5px; color: #28a745; }
        .divider { border-top: 1px solid var(--border-color); margin: 25px 0; }
        .version { text-align: center; margin-top: 20px; font-size: 11px; color: rgba(0, 255, 136, 0.1); letter-spacing: 1px; }

        @media (max-width: 768px) {
            .login-container { padding: 30px 20px; margin-top: 65px; }
            .controls-center .system-title { font-size: 12px; }
            .control-btn { width: 32px; height: 32px; font-size: 14px; }
            .user-info .name { display: none; }
        }

        @media (max-width: 480px) {
            .login-container { padding: 25px 15px; }
            .logo i { font-size: 48px; padding: 15px; }
            .otp-input { font-size: 22px; letter-spacing: 8px; }
            .controls-center .system-title { font-size: 10px; }
            .control-btn { width: 28px; height: 28px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <header class="controls-bar">
        <div class="controls-left">
            <button class="control-btn" onclick="window.history.back()" title="Voltar (Alt+V)"><i class="fas fa-arrow-left"></i></button>
            <button class="control-btn" onclick="window.history.forward()" title="Avançar (Alt+A)"><i class="fas fa-arrow-right"></i></button>
            <div class="controls-divider"></div>
            <button class="control-btn minimize-btn" onclick="minimizeWindow()" title="Minimizar (Alt+M)"><i class="fas fa-window-minimize"></i></button>
            <button class="control-btn close-btn" onclick="closeWindow()" title="Fechar (Alt+F)"><i class="fas fa-times"></i></button>
        </div>
        <div class="controls-center">
            <span class="system-title"><i class="fas fa-shield-halved" style="color: var(--text-primary);"></i> AI-DEPOM</span>
        </div>
        <div class="controls-right">
            <div class="user-info"><div class="avatar">AM</div><span class="name">Admin Master</span></div>
        </div>
    </header>

    <div class="login-container">
        <div class="logo">
            <i class="fas fa-shield-halved"></i>
            <h1>AI-DEPOM</h1>
            <span>SISTEMA POLICIAL INTELIGENTE</span>
            <div class="mt-2" style="font-size:10px; color:rgba(0,255,136,0.1);"><i class="fas fa-lock"></i> AES-256 FIPS 140-2</div>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label"><i class="fas fa-id-card me-2 text-warning" style="color: var(--text-primary);"></i>MATRÍCULA</label>
                <input type="text" class="form-control" name="matricula" placeholder="Ex: POL-001" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label"><i class="fas fa-key me-2 text-warning" style="color: var(--text-primary);"></i>SENHA</label>
                <input type="password" class="form-control" name="senha" placeholder="Digite sua senha" required>
            </div>
            <div class="mb-3">
                <label class="form-label"><i class="fas fa-qrcode me-2 text-warning" style="color: var(--text-primary);"></i>CÓDIGO OTP <span class="badge bg-danger ms-2" style="font-size:10px;">OBRIGATÓRIO</span></label>
                <input type="text" class="otp-input form-control" name="otp_code" placeholder="000000" maxlength="6" required>
                <small class="text-muted" style="font-size:11px; color: rgba(0, 255, 136, 0.2);"><i class="fas fa-info-circle me-1"></i>Código OTP (One-Time Password) gerado pelo seu autenticador</small>
            </div>
            <div class="mb-4">
                <label class="form-label"><i class="fas fa-fingerprint me-2 text-success" style="color: var(--text-primary);"></i>BIOMETRIA FACIAL</label>
                <div class="biometric-area">
                    <video id="video" autoplay muted playsinline></video>
                    <div id="biometricStatus" class="text-center">
                        <i class="fas fa-camera fa-2x text-muted mb-2" style="color: rgba(0, 255, 136, 0.2);"></i>
                        <p style="font-size:12px; color:rgba(0, 255, 136, 0.3);">Clique para ativar a câmera</p>
                        <button type="button" class="btn btn-sm btn-outline-warning" onclick="startBiometric()" style="color: var(--text-primary); border-color: var(--border-color);">
                            <i class="fas fa-camera"></i> Ativar Biometria
                        </button>
                    </div>
                    <div id="biometricResult" style="display:none; margin-top:10px;">
                        <span class="badge bg-success"><i class="fas fa-check"></i> Biometria Validada</span>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt me-2"></i>ACESSAR SISTEMA</button>
        </form>

        <div class="divider"></div>
        <div class="security-badge">
            <span><i class="fas fa-shield"></i> FIPS 140-2</span>
            <span><i class="fas fa-globe"></i> CJIS Compliant</span>
            <span><i class="fas fa-database"></i> LGPD/GDPR</span>
            <span><i class="fas fa-lock"></i> AES-256</span>
        </div>
        <div class="version">VERSÃO 1.0.0 | SISTEMA CERTIFICADO</div>
    </div>

    <script>
        function minimizeWindow() {
            try { if (window.moveTo && window.resizeTo) { window.moveTo(0, 0); window.resizeTo(screen.width / 2, screen.height / 2); } else { alert('Use o botão de minimizar do seu navegador.'); } } catch (e) { console.warn('Minimizar não suportado:', e); }
        }
        function closeWindow() {
            if (confirm('Deseja realmente fechar o sistema?')) { try { window.close(); } catch (e) { window.location.href = '01-apresentacao.html'; } }
        }

        function startBiometric() {
            const video = document.getElementById('video');
            const status = document.getElementById('biometricStatus');
            const result = document.getElementById('biometricResult');
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => { video.srcObject = stream; video.style.display = 'block'; status.style.display = 'none'; result.style.display = 'block'; setTimeout(() => { result.innerHTML = '<span class="badge bg-success"><i class="fas fa-check"></i> Biometria Validada</span>'; }, 2000); })
                .catch(err => { alert('Erro ao acessar a câmera. Use o código OTP para autenticação.'); console.error('Erro na biometria:', err); });
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const matricula = this.querySelector('input[name="matricula"]').value;
            const senha = this.querySelector('input[name="senha"]').value;
            const otp = this.querySelector('input[name="otp_code"]').value;

            if (!matricula || !senha || !otp) { alert('⚠️ Todos os campos são obrigatórios!'); return; }
            if (otp.length < 6) { alert('⚠️ O código OTP deve ter 6 dígitos!'); return; }
            if (!/^\d{6}$/.test(otp)) { alert('⚠️ O código OTP deve conter apenas números!'); return; }

            alert('✅ AUTENTICAÇÃO REALIZADA COM SUCESSO!\n\n📋 Matrícula: ' + matricula + '\n🔐 OTP: ' + otp + '\n🛡️ 3 fatores validados: Matrícula + Senha + OTP\n\nRedirecionando para o dashboard...');
            window.location.href = '03-dashboard.html';
        });

        document.querySelector('input[name="otp_code"]').addEventListener('input', function() { this.value = this.value.replace(/\D/g, '').slice(0, 6); });
    </script>
</body>
</html>
