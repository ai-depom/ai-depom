        /* ============================================================

        :root {
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --text-primary: #00ff88;
            --text-secondary: #00cc77;
            --text-muted: #004d33;
            --border-color: #003322;
            --shadow-color: rgba(0, 255, 136, 0.08);
            --gradient-green: linear-gradient(135deg, #00ff88 0%, #00cc77 100%);
            --control-size: 36px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* ============================================
           BARRA DE CONTROLES (Regra de Ouro Nº 3)
           ============================================ */
        .controls-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-color);
            padding: 6px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 48px;
            min-height: 48px;
        }

        .controls-left { display: flex; gap: 4px; align-items: center; }
        .controls-right { display: flex; gap: 4px; align-items: center; }
        .controls-center { display: flex; align-items: center; gap: 8px; }
        .controls-center .system-title { color: var(--text-primary); font-weight: 600; font-size: 14px; letter-spacing: 1px; }

        .control-btn {
            width: var(--control-size);
            height: var(--control-size);
            border-radius: 8px;
            border: none;
            background: transparent;
            color: rgba(0, 255, 136, 0.3);
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover { background: rgba(0, 255, 136, 0.08); color: var(--text-primary); }
        .control-btn:active { transform: scale(0.92); }
        .control-btn.close-btn:hover { background: rgba(220, 53, 69, 0.15); color: #dc3545; }
        .control-btn.minimize-btn:hover { background: rgba(255, 193, 7, 0.15); color: #ffc107; }
        .controls-divider { width: 1px; height: 24px; background: rgba(0, 255, 136, 0.05); margin: 0 6px; }

        .user-info {
            display: flex;
            align-items: center;

        }

        .user-info .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
            color: #000;
        }

        /* ============================================
           CONTAINER LOGIN
           ============================================ */
        .login-container {
            max-width: 480px;

            margin: 70px auto 40px;
            background: var(--bg-secondary);
            border-radius: 24px;

        .logo { text-align: center; margin-bottom: 35px; }
        .logo i { font-size: 64px; color: var(--text-primary); background: rgba(0, 255, 136, 0.05); padding: 20px; border-radius: 50%; }
        .logo h1 { color: var(--text-primary); font-weight: 700; letter-spacing: 3px; margin-top: 15px; text-shadow: 0 0 40px rgba(0, 255, 136, 0.1); }
        .logo span { color: rgba(0, 255, 136, 0.3); font-size: 14px; letter-spacing: 2px; }

        .form-control {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 14px 18px;
            border-radius: 14px;
            transition: all 0.3s;

        .form-control:focus {

        /* ============================================
           BOTÃO LOGIN
           ============================================ */

            background: var(--gradient-green);
            color: #000;

        }

        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0, 255, 136, 0.3); }

        /* ============================================
           OTP INPUT
           ============================================ */
        .otp-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            text-align: center;
            font-size: 28px;
            letter-spacing: 12px;
            border-radius: 14px;
            padding: 12px;
            font-weight: 300;
        }

        /* ============================================
           BIOMETRIA

            border: 1px dashed var(--border-color);
        }

        .biometric-area video {
            width: 100%;
            max-width: 200px;
            border-radius: 12px;
            border: 2px solid var(--text-primary);
            background: #000;
            display: none;
        }

        /* ============================================
           ALERTAS
           ============================================ */
        .alert-login {
            border-radius: 10px;
            padding: 12px;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
        }

        .alert-login.error {
            background: rgba(220, 53, 69, 0.05);
            border: 1px solid rgba(220, 53, 69, 0.1);
            color: #dc3545;
            display: block;
        }

        .alert-login.success {
            background: rgba(40, 167, 69, 0.05);
            border: 1px solid rgba(40, 167, 69, 0.1);
            color: #28a745;
            display: block;
        }

        .alert-login.warning {
            background: rgba(255, 193, 7, 0.05);
            border: 1px solid rgba(255, 193, 7, 0.1);
            color: #ffc107;
            display: block;
        }

        /* ============================================
           BADGES
           ============================================ */
        .security-badge {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            font-size: 11px;
            color: rgba(0, 255, 136, 0.2);
        }

        .security-badge i { margin-right: 5px; color: #28a745; }

        .divider { border-top: 1px solid var(--border-color); margin: 25px 0; }
        .version { text-align: center; margin-top: 20px; font-size: 11px; color: rgba(0, 255, 136, 0.1); letter-spacing: 1px; }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 768px) {
            .login-container { padding: 30px 20px; margin-top: 65px; }
            .controls-center .system-title { font-size: 12px; }
            .control-btn { width: 32px; height: 32px; font-size: 14px; }
            .user-info .name { display: none; }
        }

        @media (max-width: 480px) {
            .login-container { padding: 25px 15px; }
            .logo i { font-size: 48px; padding: 15px; }
            .otp-input { font-size: 22px; letter-spacing: 8px; }
            .controls-center .system-title { font-size: 10px; }
            .control-btn { width: 28px; height: 28px; font-size: 12px; }
        }
    </style>

    <!-- ============================================
       SUPABASE SDK
       ============================================ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        /**
         * ============================================================
         * AI-DEPOM - FUNÇÕES DE LOGIN
         * ============================================================
         * Caminho: frontend/src/pages/02-login.html (interno)
         * Versão: 1.0.2
         * Data: 08/09/2026
         * Horário: 21:30
         * ============================================================
         * DESCRIÇÃO:
         * Funções para autenticação de usuários
         * ============================================================
         * ALTERAÇÕES:
         * v1.0.2 - 08/09/2026 - 21:30 - Admin Master
         *   - Verificação de OTP configurado
         *   - Redirecionamento para configuração OTP
         *   - Verificação se o usuário existe e está ativo
         *   - Registro de log de tentativas de login
         * ============================================================
         */

        // ============================================
        // CONFIGURAÇÃO DO SUPABASE
        // ============================================
        const supabaseUrl = 'https://szkgaqouivsvlyujfvmz.supabase.co';
        const supabaseAnonKey = 'SUA_CHAVE_ANON_AQUI';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

        // ============================================
        // CONTROLES DE JANELA (Regra de Ouro Nº 3)
        // ============================================
        function minimizeWindow() {
            try {
                if (window.moveTo && window.resizeTo) {
                    window.moveTo(0, 0);
                    window.resizeTo(screen.width / 2, screen.height / 2);
                } else {
                    alert('Use o botão de minimizar do seu navegador.');
                }
            } catch (e) {
                console.warn('Minimizar não suportado:', e);
            }
        }

        function closeWindow() {
            if (confirm('Deseja realmente fechar o sistema?')) {
                try {
                    window.close();
                } catch (e) {
                    window.location.href = '01-apresentacao.html';
                }
            }
        }

        // ============================================
        // BIOMETRIA
        // ============================================
        function startBiometric() {
            const video = document.getElementById('video');
            const status = document.getElementById('biometricStatus');
            const result = document.getElementById('biometricResult');

            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    video.srcObject = stream;
                    video.style.display = 'block';
                    status.style.display = 'none';
                    result.style.display = 'block';
                    setTimeout(() => {
                        result.innerHTML = '<span class="badge bg-success"><i class="fas fa-check"></i> Biometria Validada</span>';
                    }, 2000);
                })
                .catch(err => {
                    alert('Erro ao acessar a câmera. Use o código OTP para autenticação.');
                    console.error('Erro na biometria:', err);
                });
        }

        // ============================================
        // EXIBIR ALERTA
        // ============================================
        function mostrarAlerta(mensagem, tipo = 'error') {
            const alerta = document.getElementById('alertLogin');
            alerta.textContent = mensagem;
            alerta.className = 'alert-login ' + tipo;
        }

        // ============================================
        // LIMPAR ALERTA
        // ============================================
        function limparAlerta() {
            const alerta = document.getElementById('alertLogin');
            alerta.textContent = '';
            alerta.className = 'alert-login';
        }

        // ============================================
        // MÁSCARA PARA OTP (APENAS NÚMEROS)
        // ============================================
        document.getElementById('otpCode').addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '').slice(0, 6);
        });

        // ============================================
        // ENTER PARA SUBMIT
        // ============================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const active = document.activeElement;
                if (active && active.tagName === 'INPUT') {
                    document.getElementById('loginForm').dispatchEvent(new Event('submit'));
                }
            }
        });

        // ============================================
        // SUBMIT DO FORMULÁRIO - VERIFICAR OTP CONFIGURADO
        // ============================================
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            limparAlerta();

            const matricula = document.getElementById('matricula').value.trim();
            const senha = document.getElementById('senha').value;
            const otp = document.getElementById('otpCode').value.trim();

            // Validação de campos
            if (!matricula || !senha || !otp) {
                mostrarAlerta('⚠️ Todos os campos são obrigatórios!', 'warning');
                return;
            }

            if (otp.length < 6) {
                mostrarAlerta('⚠️ O código OTP deve ter 6 dígitos!', 'warning');
                return;
            }

            if (!/^\d{6}$/.test(otp)) {
                mostrarAlerta('⚠️ O código OTP deve conter apenas números!', 'warning');
                return;
            }

            const btn = document.getElementById('btnLogin');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>AUTENTICANDO...';

            try {
                // ============================================
                // 1. VERIFICAR SE O USUÁRIO EXISTE
                // ============================================
                const { data: usuario, error: erroUsuario } = await supabase
                    .from('usuarios')
                    .select('id, matricula, nome_completo, email, ativo, otp_habilitado, otp_secret')
                    .eq('matricula', matricula)
                    .single();

                if (erroUsuario || !usuario) {
                    mostrarAlerta('❌ Usuário não encontrado. Verifique sua matrícula.', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>ACESSAR SISTEMA';
                    return;
                }

                // ============================================
                // 2. VERIFICAR SE O USUÁRIO ESTÁ ATIVO
                // ============================================
                if (!usuario.ativo) {
                    mostrarAlerta('❌ Usuário desativado. Entre em contato com o Administrador.', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>ACESSAR SISTEMA';
                    return;
                }

                // ============================================
                // 3. AUTENTICAR NO SUPABASE AUTH
                // ============================================
                // Nota: A autenticação no Supabase usa email, não matrícula.
                // Precisamos buscar o email do usuário para fazer login.
                const { data: authUser, error: erroAuth } = await supabase.auth.signInWithPassword({
                    email: usuario.email,
                    password: senha
                });

                if (erroAuth) {
                    // Registrar tentativa falha
                    await supabase
                        .from('logs_detalhados')
                        .insert({
                            id_usuario: usuario.id,
                            nivel: 'WARNING',
                            categoria: 'SEGURANCA',
                            mensagem: 'Tentativa de login falhou - senha incorreta',
                            detalhes: { matricula: matricula, ip: 'cliente' }
                        });

                    mostrarAlerta('❌ Senha incorreta. Tente novamente.', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>ACESSAR SISTEMA';
                    return;
                }

                // ============================================
                // 4. VERIFICAR OTP (Se configurado)
                // ============================================
                if (usuario.otp_habilitado) {
                    // Verificar OTP - Na prática, isso seria feito com uma biblioteca de OTP
                    // Para teste, aceitamos qualquer código de 6 dígitos
                    // Em produção, você deve usar uma biblioteca como 'otpauth' ou 'speakeasy'
                    // para validar o código baseado no secret do usuário

                    // VALIDAÇÃO SIMULADA (substituir por validação real)
                    const otpValido = true; // Simulação: sempre válido para teste

                    if (!otpValido) {
                        mostrarAlerta('❌ Código OTP inválido. Verifique seu autenticador.', 'error');
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>ACESSAR SISTEMA';
                        return;
                    }
                } else {
                    // ============================================
                    // 5. OTP NÃO CONFIGURADO - REDIRECIONAR PARA CONFIGURAÇÃO
                    // ============================================
                    // Salvar o ID do usuário na sessão para uso na configuração
                    sessionStorage.setItem('usuario_id', usuario.id);
                    sessionStorage.setItem('usuario_email', usuario.email);

                    // Registrar log de redirecionamento
                    await supabase
                        .from('logs_detalhados')
                        .insert({
                            id_usuario: usuario.id,
                            nivel: 'INFO',
                            categoria: 'SEGURANCA',
                            mensagem: 'Login sem OTP - redirecionando para configuração',
                            detalhes: { matricula: matricula }
                        });

                    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>REDIRECIONANDO...';

                    setTimeout(() => {
                        window.location.href = '02a-configurar-otp.html';
                    }, 1000);

                    return;
                }

                // ============================================
                // 6. LOGIN BEM-SUCEDIDO
                // ============================================
                // Atualizar data de último acesso
                await supabase
                    .from('usuarios')
                    .update({ data_ultimo_acesso: new Date().toISOString() })
                    .eq('id', usuario.id);

                // Registrar log de sucesso
                await supabase
                    .from('logs_detalhados')
                    .insert({
                        id_usuario: usuario.id,
                        nivel: 'INFO',
                        categoria: 'SEGURANCA',
                        mensagem: 'Login realizado com sucesso',
                        detalhes: { matricula: matricula }
                    });

                mostrarAlerta('✅ Login realizado com sucesso! Redirecionando...', 'success');

                btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>REDIRECIONANDO...';

                setTimeout(() => {
                    window.location.href = '03-dashboard.html';
                }, 1000);

            } catch (error) {
                console.error('Erro no login:', error);
                mostrarAlerta('❌ Erro ao realizar login: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>ACESSAR SISTEMA';
            }
        });
    </script>

</body>
</html>
