 <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Sistema PCivil</title>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #667eea, #764ba2, #667eea);
            background-size: 200% 100%;
            animation: gradientMove 3s ease infinite;
        }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-area .icon {
            font-size: 48px;
            color: #667eea;
            background: rgba(102, 126, 234, 0.1);
            width: 80px;
            height: 80px;
            line-height: 80px;
            border-radius: 50%;
            display: inline-block;
            margin-bottom: 10px;
        }

        .logo-area h1 {
            font-size: 24px;
            color: #2d3748;
            font-weight: 700;
        }

        .logo-area p {
            color: #718096;
            font-size: 14px;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 6px;
        }

        .form-group .input-wrapper {
            position: relative;
        }

        .form-group .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            font-size: 16px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 12px 12px 44px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #f7fafc;
            color: #2d3748;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .form-group input::placeholder {
            color: #a0aec0;
        }

        .form-group .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #a0aec0;
            transition: color 0.3s ease;
            background: none;
            border: none;
            font-size: 16px;
        }

        .form-group .toggle-password:hover {
            color: #667eea;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 25px;
            font-size: 14px;
        }

        .form-options label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #4a5568;
            cursor: pointer;
        }

        .form-options label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #667eea;
            cursor: pointer;
        }

        .form-options a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .form-options a:hover {
            color: #5a67d8;
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-login .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        .btn-login.loading .spinner {
            display: inline-block;
        }

        .btn-login.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            display: none;
            background: #fed7d7;
            color: #c53030;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            border-left: 4px solid #fc8181;
            align-items: center;
            gap: 10px;
        }

        .error-message.show {
            display: flex;
        }

        .error-message i {
            font-size: 18px;
        }

        .success-message {
            display: none;
            background: #c6f6d5;
            color: #276749;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            border-left: 4px solid #48bb78;
            align-items: center;
            gap: 10px;
        }

        .success-message.show {
            display: flex;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            color: #718096;
            font-size: 13px;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }

        .status-badge.success {
            background: #c6f6d5;
            color: #276749;
        }

        .status-badge.error {
            background: #fed7d7;
            color: #c53030;
        }

        /* Responsivo */
        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }

            .logo-area h1 {
                font-size: 20px;
            }

            .form-options {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-area">
            <div class="icon">
                <i class="fas fa-gavel"></i>
            </div>
            <h1>PCivil Sistema</h1>
            <p>Gerencie suas atividades de forma eficiente</p>
        </div>

        <!-- Mensagem de erro -->
        <div id="errorMessage" class="error-message">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText">Erro ao fazer login. Tente novamente.</span>
        </div>

        <!-- Mensagem de sucesso -->
        <div id="successMessage" class="success-message">
            <i class="fas fa-check-circle"></i>
            <span id="successText">Login realizado com sucesso!</span>
        </div>

        <!-- Status do Supabase -->
        <div style="text-align: center; margin-bottom: 15px; font-size: 13px;">
            <span id="supabaseStatus" class="status-badge">
                <i class="fas fa-spinner fa-spin"></i> Verificando...
            </span>
        </div>

        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="matricula">
                    <i class="fas fa-id-badge"></i> Matrícula
                </label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input 
                        type="text" 
                        id="matricula" 
                        placeholder="Digite sua matrícula" 
                        required
                        autofocus
                        value="ADM-MASTER-001"
                    />
                </div>
            </div>

            <div class="form-group">
                <label for="senha">
                    <i class="fas fa-lock"></i> Senha
                </label>
                <div class="input-wrapper">
                    <i class="fas fa-key"></i>
                    <input 
                        type="password" 
                        id="senha" 
                        placeholder="Digite sua senha" 
                        required
                        value="123456"
                    />
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar senha">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-options">
                <label>
                    <input type="checkbox" id="rememberMe" checked />
                    <span>Lembrar-me</span>
                </label>
                <a href="#" id="forgotPassword">Esqueceu a senha?</a>
            </div>

            <button type="submit" class="btn-login" id="btnLogin">
                <span class="spinner"></span>
                <span class="btn-text">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </span>
            </button>
        </form>

        <div class="footer">
            <p>
                <i class="fas fa-shield-alt"></i>
                Sistema seguro • Dados protegidos
            </p>
            <p style="margin-top: 5px; font-size: 12px; color: #a0aec0;">
                Versão 2.0.0
            </p>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURAÇÕES
        // ============================================
        const supabaseUrl = 'https://szkgaqouivsvlyujfvmz.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN6a2dhcW91aXZzdmx5dWpmdm16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MzY0MjksImV4cCI6MjEwNDExMjQyOX0.4KBCiRxjZZrfaEBqfiFVSp9ECOy37brn1JFC7ga_2Hc';

        // ============================================
        // INICIALIZAR SUPABASE
        // ============================================
        let supabase = null;
        let supabaseInicializado = false;

        try {
            console.log('🚀 Inicializando Supabase...');
            console.log('📌 URL:', supabaseUrl);
            console.log('📌 Key:', supabaseAnonKey.substring(0, 20) + '...');

            supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);
            supabaseInicializado = true;
            
            console.log('✅ Supabase inicializado com sucesso!');
            document.getElementById('supabaseStatus').innerHTML = 
                '<i class="fas fa-check-circle"></i> ✅ Supabase conectado';
            document.getElementById('supabaseStatus').className = 'status-badge success';
        } catch (error) {
            console.error('❌ Erro ao inicializar Supabase:', error);
            document.getElementById('supabaseStatus').innerHTML = 
                '<i class="fas fa-times-circle"></i> ❌ Erro de conexão';
            document.getElementById('supabaseStatus').className = 'status-badge error';
            showError('Erro ao conectar com o servidor. Verifique sua conexão.');
        }

        // ============================================
        // ELEMENTOS DOM
        // ============================================
        const loginForm = document.getElementById('loginForm');
        const matriculaInput = document.getElementById('matricula');
        const senhaInput = document.getElementById('senha');
        const btnLogin = document.getElementById('btnLogin');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const successMessage = document.getElementById('successMessage');
        const successText = document.getElementById('successText');
        const togglePassword = document.getElementById('togglePassword');
        const rememberMe = document.getElementById('rememberMe');

        // ============================================
        // FUNÇÕES DE UTILIDADE
        // ============================================
        function showError(message) {
            errorText.textContent = message;
            errorMessage.classList.add('show');
            successMessage.classList.remove('show');
        }

        function hideError() {
            errorMessage.classList.remove('show');
        }

        function showSuccess(message) {
            successText.textContent = message;
            successMessage.classList.add('show');
            errorMessage.classList.remove('show');
        }

        function hideSuccess() {
            successMessage.classList.remove('show');
        }

        function setLoading(loading) {
            if (loading) {
                btnLogin.classList.add('loading');
                btnLogin.disabled = true;
            } else {
                btnLogin.classList.remove('loading');
                btnLogin.disabled = false;
            }
        }

        // ============================================
        // FUNÇÃO DE LOGIN PRINCIPAL
        // ============================================
        async function fazerLogin(event) {
            event.preventDefault();
            hideError();
            hideSuccess();

            // Validar Supabase
            if (!supabaseInicializado || !supabase) {
                showError('Sistema não conectado. Recarregue a página e tente novamente.');
                return;
            }

            const matricula = matriculaInput.value.trim();
            const senha = senhaInput.value.trim();

            // Validações básicas
            if (!matricula) {
                showError('Por favor, digite sua matrícula.');
                matriculaInput.focus();
                return;
            }

            if (!senha) {
                showError('Por favor, digite sua senha.');
                senhaInput.focus();
                return;
            }

            console.log('🔐 Tentando login para matrícula:', matricula);
            setLoading(true);

            try {
                // ============================================
                // PASSO 1: BUSCAR USUÁRIO PELA MATRÍCULA
                // ============================================
                console.log('🔍 Passo 1: Buscando usuário...');
                
                const { data: usuario, error: buscaError } = await supabase
                    .from('usuarios')
                    .select('id, matricula, nome_completo, email, ativo, setor, id_perfil_acesso, primeiro_acesso, deletado')
                    .eq('matricula', matricula)
                    .maybeSingle();  // ← CRUCIAL: usar maybeSingle() em vez de single()

                // Verificar erro de busca
                if (buscaError) {
                    console.error('❌ Erro na busca:', buscaError);
                    
                    // PGRST116 = nenhum registro encontrado (é esperado)
                    if (buscaError.code === 'PGRST116') {
                        console.log('ℹ️ Matrícula não encontrada:', matricula);
                        showError('Matrícula não encontrada. Verifique e tente novamente.');
                        setLoading(false);
                        return;
                    }
                    
                    // Outro erro inesperado
                    console.error('❌ Erro inesperado na busca:', buscaError);
                    showError('Erro ao buscar usuário. Tente novamente mais tarde.');
                    setLoading(false);
                    return;
                }

                // Verificar se encontrou o usuário
                if (!usuario) {
                    console.log('❌ Usuário não encontrado (data é null)');
                    showError('Matrícula não encontrada. Verifique e tente novamente.');
                    setLoading(false);
                    return;
                }

                console.log('✅ Usuário encontrado:', usuario);

                // ============================================
                // PASSO 2: VALIDAR DADOS DO USUÁRIO
                // ============================================
                
                // Verificar se o usuário está deletado
                if (usuario.deletado === true) {
                    console.log('❌ Usuário deletado');
                    showError('Usuário deletado. Contate o administrador.');
                    setLoading(false);
                    return;
                }

                // Verificar se o usuário está ativo
                if (usuario.ativo !== true) {
                    console.log('❌ Usuário inativo');
                    showError('Usuário inativo. Contate o administrador.');
                    setLoading(false);
                    return;
                }

                // Verificar se o email existe
                if (!usuario.email) {
                    console.error('❌ Usuário sem email cadastrado');
                    showError('Usuário sem email cadastrado. Contate o administrador.');
                    setLoading(false);
                    return;
                }

                console.log('✅ Usuário validado com sucesso!');
                console.log('📧 Email:', usuario.email);

                // ============================================
                // PASSO 3: AUTENTICAR COM EMAIL E SENHA
                // ============================================
                console.log('🔐 Passo 2: Autenticando com email:', usuario.email);
                
                const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                    email: usuario.email,
                    password: senha
                });

                if (authError) {
                    console.error('❌ Erro na autenticação:', authError);
                    
                    // Tratamento específico para erros de autenticação
                    if (authError.message.includes('Invalid login credentials')) {
                        showError('Senha incorreta. Tente novamente.');
                    } else if (authError.message.includes('Email not confirmed')) {
                        showError('Email não confirmado. Verifique sua caixa de entrada.');
                    } else {
                        showError('Erro na autenticação: ' + authError.message);
                    }
                    
                    setLoading(false);
                    return;
                }

                console.log('✅ Autenticação bem-sucedida!');
                console.log('👤 Usuário autenticado:', authData.user.email);

                // ============================================
                // PASSO 4: SALVAR DADOS NA SESSÃO
                // ============================================
                try {
                    sessionStorage.setItem('usuario', JSON.stringify(usuario));
                    sessionStorage.setItem('authData', JSON.stringify(authData));
                    sessionStorage.setItem('usuarioId', usuario.id);
                    
                    if (rememberMe.checked) {
                        localStorage.setItem('rememberMe', 'true');
                        localStorage.setItem('lastMatricula', matricula);
                    } else {
                        localStorage.removeItem('rememberMe');
                        localStorage.removeItem('lastMatricula');
                    }
                } catch (storageError) {
                    console.warn('⚠️ Erro ao salvar dados na sessão:', storageError);
                    // Não bloqueia o login
                }

                // ============================================
                // PASSO 5: REDIRECIONAR
                // ============================================
                console.log('🚀 Login bem-sucedido!');
                showSuccess('Login realizado com sucesso! Redirecionando...');

                // Aguardar 1.5 segundos para mostrar a mensagem de sucesso
                setTimeout(() => {
                    if (usuario.primeiro_acesso === true) {
                        console.log('🔄 Primeiro acesso - redirecionando para troca de senha');
                        window.location.href = '03-primeiro-acesso.html';
                    } else {
                        console.log('📊 Redirecionando para dashboard');
                        window.location.href = '04-dashboard.html';
                    }
                }, 1500);

            } catch (error) {
                console.error('❌ Erro inesperado no login:', error);
                showError('Ocorreu um erro inesperado. Tente novamente.');
                setLoading(false);
            } finally {
                // Se não redirecionou, garantir que o loading seja removido após 5 segundos
                setTimeout(() => {
                    setLoading(false);
                }, 5000);
            }
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================
        
        // Submit do formulário
        loginForm.addEventListener('submit', fazerLogin);

        // Toggle mostrar/ocultar senha
        togglePassword.addEventListener('click', function() {
            const type = senhaInput.getAttribute('type') === 'password' ? 'text' : 'password';
            senhaInput.setAttribute('type', type);
            this.querySelector('i').classList.toggle('fa-eye');
            this.querySelector('i').classList.toggle('fa-eye-slash');
        });

        // Enter key no campo de senha
        senhaInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                loginForm.dispatchEvent(new Event('submit'));
            }
        });

        // Enter key no campo de matrícula
        matriculaInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                senhaInput.focus();
            }
        });

        // Recuperar dados salvos
        document.addEventListener('DOMContentLoaded', function() {
            try {
                const remember = localStorage.getItem('rememberMe');
                const lastMatricula = localStorage.getItem('lastMatricula');
                
                if (remember === 'true' && lastMatricula) {
                    matriculaInput.value = lastMatricula;
                    rememberMe.checked = true;
                }
                
                console.log('✅ Página carregada com sucesso!');
                console.log('🔍 Status: Pronto para login');
            } catch (error) {
                console.warn('⚠️ Erro ao carregar dados salvos:', error);
            }
        });

        // ============================================
        // FUNÇÃO DE TESTE RÁPIDO (apenas diagnóstico)
        // ============================================
        async function testarBusca() {
            console.log('🧪 Teste rápido de busca...');
            
            if (!supabaseInicializado || !supabase) {
                console.error('❌ Supabase não inicializado');
                return;
            }

            const { data, error } = await supabase
                .from('usuarios')
                .select('*')
                .eq('matricula', 'ADM-MASTER-001')
                .maybeSingle();

            if (error) {
                console.error('❌ Erro no teste:', error);
                console.log('📌 Código:', error.code);
                console.log('📌 Mensagem:', error.message);
            } else if (data) {
                console.log('✅ Teste bem-sucedido!');
                console.log('📋 Dados:', data);
                console.log('🎉 Usuário encontrado com sucesso!');
            } else {
                console.log('❌ Nenhum usuário encontrado (data é null)');
            }
        }

        // ============================================
        // INICIALIZAÇÃO
        // ============================================
        console.log('✅ Página de login carregada.');
        console.log('📌 Supabase inicializado:', supabaseInicializado ? '✅ Sim' : '❌ Não');
        console.log('✅ QRCODE REMOVIDO - Login direto com matrícula e senha');
        
        // Executar teste automático após 2 segundos (apenas para diagnóstico)
        setTimeout(() => {
            if (supabaseInicializado) {
                testarBusca();
            }
        }, 2000);

        // ============================================
        // EXPORTAÇÃO GLOBAL (para debug no console)
        // ============================================
        window.supabase = supabase;
        window.testarBusca = testarBusca;
        window.fazerLogin = fazerLogin;
        window.verificarUsuario = async function(matricula) {
            const { data, error } = await supabase
                .from('usuarios')
                .select('*')
                .eq('matricula', matricula)
                .maybeSingle();
            
            if (error) {
                console.error('❌ Erro:', error);
                return null;
            }
            return data;
        };

        console.log('💡 Dicas para debug:');
        console.log('   - Digite window.testarBusca() no console para testar a busca');
        console.log('   - Digite window.verificarUsuario("ADM-MASTER-001") para verificar um usuário específico');
        console.log('   - Use as credenciais: Matrícula=ADM-MASTER-001, Senha=123456');
    </script>

</body>
</html>
