<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-DEPOM - Cadastro de Suspeito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== MESMOS ESTILOS DO DASHBOARD E CADASTRO DE USUÁRIO ===== */
        :root {
            --police-blue: #0a1e3d;
            --police-dark: #060d1a;
            --police-gold: #c9a84c;
            --shadow-gold: rgba(201, 168, 76, 0.15);
            --gradient-gold: linear-gradient(135deg, #c9a84c 0%, #a8893a 100%);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            background: var(--police-dark);
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .sidebar { /* ... mesmo estilo do dashboard ... */ }
        .main-content { margin-left: 260px; padding: 25px 30px; min-height: 100vh; }
        .top-bar { /* ... mesmo estilo do dashboard ... */ }
        .form-card { background: rgba(255,255,255,0.02); border-radius: 14px; padding: 25px; border: 1px solid rgba(255,255,255,0.03); }
        .card-title { color: var(--police-gold); font-size: 14px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; border-bottom: 1px solid rgba(201,168,76,0.08); padding-bottom: 12px; margin-bottom: 20px; }
        .card-title i { margin-right: 10px; opacity: 0.7; }
        .form-label { color: rgba(255,255,255,0.5); font-size: 12px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
        .form-control, .form-select { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.06); color: #fff; padding: 10px 14px; border-radius: 10px; transition: all 0.3s; }
        .form-control:focus, .form-select:focus { background: rgba(0,0,0,0.4); border-color: var(--police-gold); box-shadow: 0 0 0 4px rgba(201,168,76,0.08); color: #fff; }
        .form-control::placeholder { color: rgba(255,255,255,0.15); }
        .btn-gold { background: var(--gradient-gold); color: var(--police-dark); font-weight: 700; padding: 10px 28px; border-radius: 10px; border: none; transition: all 0.3s; letter-spacing: 0.5px; }
        .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(201,168,76,0.3); color: var(--police-dark); }
        .btn-outline-gold { background: transparent; color: var(--police-gold); border: 1px solid var(--police-gold); padding: 10px 28px; border-radius: 10px; font-weight: 600; transition: all 0.3s; }
        .btn-outline-gold:hover { background: rgba(201,168,76,0.05); color: var(--police-gold); }
        .upload-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
        .upload-box { background: rgba(0,0,0,0.2); border: 2px dashed rgba(255,255,255,0.05); border-radius: 12px; padding: 16px 12px; text-align: center; cursor: pointer; transition: all 0.3s; }
        .upload-box:hover { border-color: var(--police-gold); background: rgba(201,168,76,0.03); }
        .upload-box i { font-size: 24px; color: var(--police-gold); opacity: 0.4; display: block; margin-bottom: 6px; }
        .upload-box .label { font-size: 11px; color: rgba(255,255,255,0.3); }
        .upload-box .size { font-size: 9px; color: rgba(255,255,255,0.15); }
        .sidebar-toggle { display: none; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); color: #fff; padding: 8px 14px; border-radius: 10px; font-size: 18px; cursor: pointer; }
        @media (max-width: 992px) { .sidebar { transform: translateX(-100%); width: 280px; } .sidebar.open { transform: translateX(0); } .main-content { margin-left: 0; } .sidebar-toggle { display: flex !important; } }
        @media (max-width: 768px) { .main-content { padding: 15px; } .top-bar { flex-direction: column; align-items: flex-start; } .upload-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 480px) { .top-actions { width: 100%; } .top-actions .badge { flex: 1; text-align: center; } .upload-grid { grid-template-columns: 1fr; } }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--police-dark); }
        ::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.3); border-radius: 4px; }
    </style>
</head>
